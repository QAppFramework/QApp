name: CI

on:
  push:
    branches: [dev, main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Verify clean checkout
        run: |
          if ! git diff --quiet HEAD; then
            echo "::error::Dirty working tree — cannot build for release"
            exit 1
          fi

      - name: Validate version (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          # Check this version hasn't been released before
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "::error::Version $TAG already released. Bump the version before tagging."
            exit 1
          fi
          echo "Version $VERSION — not previously released. Proceeding."

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libxkbcommon-dev libdbus-1-dev \
            libnss3-dev libxcomposite-dev libxdamage-dev \
            libxrandr-dev libxtst-dev libxkbfile-dev \
            libfontconfig1-dev libfreetype6-dev \
            libxcb-cursor0 libxcb-cursor-dev \
            rpm

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          modules: 'qtwebengine qtwebchannel qtpositioning'
          cache: true

      - name: Configure
        run: |
          if [ -n "${VERSION:-}" ]; then
            # Tag build: inject version from git tag into binary
            cmake -B build -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PROJECT_VERSION="$VERSION"
          else
            # Branch build: use version from CMakeLists.txt
            cmake -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: cd build && ctest --output-on-failure

      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd build
          cpack -G DEB
          cpack -G RPM
          cpack -G TGZ

      - name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            build/*.deb
            build/*.rpm
            build/*.tar.gz

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.deb
            build/*.rpm
            build/*.tar.gz
          generate_release_notes: true
