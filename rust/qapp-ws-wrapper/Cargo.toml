[package]
name = "qapp_ws_wrapper"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
qapp_common = { path = "../qapp-common" }
cxx = "1"
cxx-qt = "0.7"
cxx-qt-lib = { version = "0.7", features = ["qt_full"] }
serde_json = "1"
url = "2"
dirs = "6"

[build-dependencies]
cxx-qt-build = "0.7"
